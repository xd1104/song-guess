<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今晚猜歌</title>
<meta name="theme-color" content="#14262d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  color-scheme: dark;
  --night:#14262d;      /* 夜色底 */
  --night-2:#1c3440;
  --shell:#2a2a2e;      /* 卡帶外殼 */
  --shell-edge:#3c3c42;
  --label:#f0d27a;      /* 卡帶標籤黃 */
  --stripe:#d9563a;     /* 標籤紅條 */
  --ink:#2b2118;        /* 標籤上的筆跡 */
  --text:#eef2ef;
  --muted:#9fb3b0;
  --line:#2f4a54;
  --good:#7fcf9a;
  --hand:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--night); color:var(--text);
  font:15px/1.55 var(--sans);
  background-image:radial-gradient(120% 60% at 50% 0%, var(--night-2), var(--night) 70%);
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:460px; margin:0 auto; padding-inline:16px; padding-block:18px 28px; display:flex; flex-direction:column; gap:16px; min-height:100%}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--label); outline-offset:2px}

/* 頂部：計數器 */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px}
.brand{font:700 22px/1 var(--hand); letter-spacing:.04em; color:var(--label)}
.brand small{display:block; font:500 11px/1.4 var(--sans); color:var(--muted); letter-spacing:.12em; margin-top:4px}
.counter{display:flex; gap:6px; align-items:center; font:600 13px/1 var(--mono); color:var(--muted)}
.counter b{background:#0d1a1f; color:var(--label); padding:6px 8px; border-radius:4px; letter-spacing:.12em; border:1px solid var(--line)}

/* 卡帶 */
.deck{position:relative; aspect-ratio:1.58/1; max-width:100%; border-radius:14px; overflow:hidden;
  background:var(--shell); box-shadow:0 18px 40px -18px #000, inset 0 0 0 2px var(--shell-edge)}
.deck{isolation:isolate}
.deck iframe{position:absolute; inset:0; width:100%; height:100%; border:0; z-index:0}
.deck .cover{z-index:2; transform:translateZ(0)}
.deck .answer{z-index:3}
.cover{position:absolute; inset:0; pointer-events:none; background:var(--shell);
  display:flex; flex-direction:column; padding:5% 5.5% 3.5%; gap:3%; transition:opacity .6s ease}
.deck.revealed .cover{opacity:0}
.screw{position:absolute; width:9px; height:9px; border-radius:50%; background:#4a4a52; box-shadow:inset 0 0 0 2px #333}
.screw.a{left:10px; top:10px}.screw.b{right:10px; top:10px}.screw.c{left:10px; bottom:10px}.screw.d{right:10px; bottom:10px}
.label{flex:1; background:var(--label); border-radius:6px; position:relative; display:flex; flex-direction:column; overflow:hidden}
.label .rule{height:13%; display:flex; align-items:center; justify-content:space-between; padding:0 4%;
  color:var(--ink); font:700 clamp(12px,3.4vw,15px)/1 var(--hand)}
.label .rule span:last-child{font:600 11px/1 var(--mono); letter-spacing:.1em; opacity:.75}
.label .stripe{height:9%; background:var(--stripe)}
.label .window{flex:1; margin:4% 15%; background:#1a1a1d; border-radius:999px; position:relative;
  display:flex; align-items:center; justify-content:space-between; padding:0 7%}
.reel{width:clamp(38px,13vw,58px); aspect-ratio:1; border-radius:50%; background:#efe9dc; position:relative;
  box-shadow:0 0 0 4px #5b4a3a}
.reel::before{content:""; position:absolute; inset:28%; border-radius:50%; background:#1a1a1d}
.reel i{position:absolute; left:50%; top:50%; width:16%; height:46%; background:#1a1a1d; transform-origin:50% 0; border-radius:2px}
.reel i:nth-child(1){transform:translateX(-50%) rotate(0deg)}
.reel i:nth-child(2){transform:translateX(-50%) rotate(120deg)}
.reel i:nth-child(3){transform:translateX(-50%) rotate(240deg)}
.playing .reel{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}
.tape{position:absolute; left:28%; right:28%; top:50%; height:34%; transform:translateY(-50%); background:#3b2a20; border-radius:4px}
.hint{text-align:center; color:var(--muted); font:500 12px/1.2 var(--sans); letter-spacing:.06em; margin-bottom:-1%}
.hint b{color:var(--label)}
.tapme .hint{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.answer{position:absolute; left:0; right:0; bottom:0; padding:10px 14px; background:linear-gradient(transparent,#000d);
  font:700 20px/1.25 var(--hand); color:#fff; pointer-events:none; opacity:0; transition:opacity .5s .2s}
.answer small{display:block; font:500 13px/1.3 var(--sans); color:var(--label)}
.deck.revealed .answer{opacity:1}

/* 進度：幾秒 */
.steps{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.step{border:1px solid var(--line); border-radius:10px; padding:8px 6px; text-align:center; color:var(--muted)}
.step b{display:block; font:600 18px/1.1 var(--mono); color:var(--text)}
.step span{font-size:12px}
.step.on{border-color:var(--label); background:#f0d27a14}
.step.on b{color:var(--label)}
.step.done{opacity:.45}

.row{display:flex; gap:10px}
.btn{flex:1; min-height:52px; border-radius:12px; padding:10px 14px; font-weight:700; font-size:16px;
  background:#22404b; border:1px solid var(--line)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--label); color:var(--ink); border-color:transparent}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.35; cursor:default}
.small{flex:0 0 auto; min-height:44px; font-size:14px; font-weight:500}


/* 開始畫面 */
.panel{background:#0f1f25; border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:14px}
.panel h2{margin:0; font:700 15px/1.3 var(--sans); color:var(--muted); letter-spacing:.08em}
.packs{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.pack{border:1px solid var(--line); border-radius:10px; padding:12px 6px; text-align:center}
.pack b{display:block; font:700 17px/1.2 var(--hand)}
.pack span{font:500 12px/1 var(--mono); color:var(--muted)}
.pack[aria-pressed="true"]{border-color:var(--label); background:#f0d27a1a}
.pack[aria-pressed="true"] b{color:var(--label)}
.lens{display:flex; gap:8px; flex-wrap:wrap}
.len{border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-weight:500}
.len[aria-pressed="true"]{border-color:var(--label); color:var(--label)}
.rules{margin:0; padding-left:1.2em; color:var(--muted); font-size:13px; display:grid; gap:4px}
.fine{font-size:12px; color:var(--muted); text-align:center}

.final{text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center}
.final h1{margin:0; font:700 30px/1.25 var(--hand); color:var(--label); text-wrap:balance}
.list{width:100%; display:grid; gap:6px; text-align:left}
.list div{display:flex; justify-content:space-between; gap:10px; border-bottom:1px dashed var(--line); padding:6px 2px; font-size:14px}
.list div span:last-child{color:var(--muted); white-space:nowrap}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:#000c; color:#fff; padding:10px 16px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; max-width:90vw}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.playing .reel,.tapme .hint{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">今晚猜歌<small>兩個人的點歌機</small></div>
    <div class="counter" id="counter" hidden>第 <b id="qnum">01</b> / <span id="qtotal">10</span></div>
  </div>

  <!-- 開始畫面 -->
  <section id="setup" class="panel">
    <h2>選題庫</h2>
    <div class="packs" id="packs">
      <button class="pack" data-pack="zh" aria-pressed="false"><b>華語</b><span id="cnt-zh"></span></button>
      <button class="pack" data-pack="tw" aria-pressed="false"><b>台語</b><span id="cnt-tw"></span></button>
      <button class="pack" data-pack="mix" aria-pressed="true"><b>混著來</b><span id="cnt-mix"></span></button>
    </div>
    <h2>一局幾題</h2>
    <div class="lens" id="lens">
      <button class="len" data-n="5" aria-pressed="false">5 題</button>
      <button class="len" data-n="10" aria-pressed="true">10 題</button>
      <button class="len" data-n="20" aria-pressed="false">20 題</button>
    </div>
    <ul class="rules">
      <li>每題先聽 <b>3 秒</b>，猜不到再聽 <b>6 秒</b>、<b>12 秒</b>。</li>
      <li>猜到就按「公布答案」，對一下有沒有猜對。</li>
      <li>玩過的歌會記住，下次不會重複出現。</li>
    </ul>
    <button class="btn primary" id="startBtn">開始</button>
    <p class="fine" id="fresh"></p>
  </section>

  <!-- 遊戲畫面 -->
  <section id="game" hidden>
    <div style="display:flex; flex-direction:column; gap:14px">
      <div class="deck tapme" id="deck">
        <div id="player"></div>
        <div class="cover" aria-hidden="true">
          <i class="screw a"></i><i class="screw b"></i><i class="screw c"></i><i class="screw d"></i>
          <div class="label">
            <div class="rule"><span id="side">A 面 · 第 1 首</span><span id="pack-tag">MIX</span></div>
            <div class="stripe"></div>
            <div class="window"><div class="tape"></div><div class="reel"><i></i><i></i><i></i></div><div class="reel"><i></i><i></i><i></i></div></div>
          </div>
          <div class="hint" id="hint">點卡帶播放 <b>3 秒</b></div>
        </div>
        <div class="answer" id="answer"></div>
      </div>

      <div class="steps" id="steps">
        <div class="step on"><b>3 秒</b></div>
        <div class="step"><b>6 秒</b></div>
        <div class="step"><b>12 秒</b></div>
      </div>

      <div id="guessCtl" style="display:flex; flex-direction:column; gap:10px">
        <div class="row">
          <button class="btn primary" id="playBtn">▶ 播放 3 秒</button>
          <button class="btn" id="moreBtn">聽久一點</button>
        </div>
        <button class="btn" id="revealBtn">公布答案</button>
        <div class="row">
          <button class="btn ghost small" id="shiftBtn">換一段</button>
          <button class="btn ghost small" id="skipBtn">跳過這首</button>
        </div>
      </div>

      <div id="judge" hidden>
        <button class="btn primary" id="nextBtn" style="width:100%">下一首</button>
      </div>
    </div>
  </section>

  <!-- 結算 -->
  <section id="over" class="panel" hidden>
    <div class="final">
      <h1>這局聽了這些歌</h1>
      <div class="list" id="recap"></div>
      <div class="row" style="width:100%">
        <button class="btn primary" id="againBtn">再來一局</button>
      </div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

const STAGES=[{sec:3},{sec:6},{sec:12}];
const $=s=>document.querySelector(s);
const store={
  get(k,d){try{const v=localStorage.getItem('sg_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('sg_'+k,JSON.stringify(v))}catch(e){}}
};
let pack=store.get('pack','mix'), total=store.get('total',10);
let queue=[], qi=0, recap=[];
let cur=null, stage=0, startAt=0, state=-1, playToken=0, stopTimer=null, revealed=false, ytReady=false, iframe=null, listenTimer=null;

function poolOf(p){return SONGS.filter(s=>p==='mix'||s[4]===p)}
function played(){return new Set(store.get('played',[]))}
function refreshSetup(){
  const pl=played();
  for(const p of ['zh','tw','mix']){
    const all=poolOf(p), left=all.filter(s=>!pl.has(s[0])).length;
    $('#cnt-'+p).textContent=all.length+' 首';
  }
  document.querySelectorAll('.pack').forEach(b=>b.setAttribute('aria-pressed',b.dataset.pack===pack));
  document.querySelectorAll('.len').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.n===total));
  const left=poolOf(pack).filter(s=>!pl.has(s[0])).length;
  $('#fresh').textContent=left<total?'這個題庫快玩完了，會從頭重新洗牌。':'還沒聽過的歌有 '+left+' 首。';
}
document.querySelectorAll('.pack').forEach(b=>b.onclick=()=>{pack=b.dataset.pack;store.set('pack',pack);refreshSetup()});
document.querySelectorAll('.len').forEach(b=>b.onclick=()=>{total=+b.dataset.n;store.set('total',total);refreshSetup()});

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function buildQueue(){
  const pl=played(); let fresh=shuffle(poolOf(pack).filter(s=>!pl.has(s[0])));
  if(fresh.length<total){ // 題庫用完：清掉這個題庫的紀錄重新洗
    const ids=new Set(poolOf(pack).map(s=>s[0]));
    store.set('played',[...pl].filter(id=>!ids.has(id)));
    const rest=shuffle(poolOf(pack).filter(s=>!fresh.includes(s)));
    fresh=fresh.concat(rest);
  }
  return fresh;
}
function markPlayed(id){const a=store.get('played',[]);if(!a.includes(id)){a.push(id);store.set('played',a)}}

$('#startBtn').onclick=()=>{
  queue=buildQueue(); qi=0; recap=[];
  $('#setup').hidden=true; $('#over').hidden=true; $('#game').hidden=false; $('#counter').hidden=false;
  $('#qtotal').textContent=String(total).padStart(2,'0');
  $('#pack-tag').textContent={zh:'華語',tw:'台語',mix:'MIX'}[pack];
  loadSong();
};

/* ---- YouTube 播放器（用 postMessage，不另外載入外部程式） ---- */
function cmd(func,args){ if(iframe&&iframe.contentWindow) iframe.contentWindow.postMessage(JSON.stringify({event:'command',func,args:args||[],id:1,channel:'widget'}),'*'); }
window.addEventListener('message',e=>{
  if(!/youtube(-nocookie)?\.com$/.test(new URL(e.origin).hostname))return;
  let d; try{d=typeof e.data==='string'?JSON.parse(e.data):e.data}catch(_){return}
  if(!d||!d.event)return;
  if(d.event==='onReady'||d.event==='initialDelivery'){ytReady=true; clearInterval(listenTimer)}
  if(d.event==='onError'){ toast('這首沒辦法在這裡播，換下一首'); setTimeout(()=>nextSong(true),900); return; }
  let st=null, t=null;
  if(d.event==='onStateChange') st=d.info;
  if(d.event==='infoDelivery'&&d.info){ if('playerState' in d.info) st=d.info.playerState; if('currentTime' in d.info) t=d.info.currentTime; }
  if(st!==null&&st!==state){ state=st; onState(); }
  if(t!==null&&!revealed&&state===1&&t>=startAt+STAGES[stage].sec) stopClip();
});
function onState(){
  const deck=$('#deck');
  deck.classList.toggle('playing',state===1);
  if(state===1&&!revealed){
    deck.classList.remove('tapme');
    $('#hint').innerHTML='播放中…';
    clearTimeout(stopTimer);
    const tok=++playToken;
    stopTimer=setTimeout(()=>{if(tok===playToken)stopClip()},STAGES[stage].sec*1000+400);
  }
}
function stopClip(){
  if(revealed)return;
  clearTimeout(stopTimer); playToken++;
  if(state===1||state===2||state===3){ cmd('pauseVideo'); cmd('seekTo',[startAt,true]); }
  else cmd('cueVideoById',[cur[0],startAt]); // 還沒開始播：seekTo 會直接開播，改用重新載入起點
  readyHint();
}
function readyHint(){
  $('#deck').classList.add('tapme');
  $('#hint').innerHTML='按播放，或點卡帶';
}
function pickStart(len){
  const lo=Math.max(18,len*0.2), hi=Math.max(lo+5,len*0.68-12);
  return Math.round(lo+Math.random()*(hi-lo));
}
function mountPlayer(id){
  const host=$('#player'); host.innerHTML='';
  iframe=document.createElement('iframe');
  const origin=location.origin&&location.origin!=='null'?'&origin='+encodeURIComponent(location.origin):'';
  iframe.src='https://www.youtube.com/embed/'+id+'?enablejsapi=1&playsinline=1&controls=0&disablekb=1&rel=0&fs=0&iv_load_policy=3&start='+startAt+origin;
  iframe.allow='autoplay; encrypted-media';
  iframe.title='題目播放器';
  ytReady=false; state=-1;
  iframe.onload=()=>{
    clearInterval(listenTimer);
    const ping=()=>iframe.contentWindow&&iframe.contentWindow.postMessage(JSON.stringify({event:'listening',id:1,channel:'widget'}),'*');
    ping(); listenTimer=setInterval(()=>{ if(ytReady)clearInterval(listenTimer); else ping(); },400);
  };
  host.appendChild(iframe);
}
function loadSong(){
  cur=queue[qi]; stage=0; revealed=false; clearTimeout(stopTimer); playToken++;
  startAt=pickStart(cur[3]);
  $('#qnum').textContent=String(qi+1).padStart(2,'0');
  $('#side').textContent=(qi<total/2?'A':'B')+' 面 · 第 '+(qi+1)+' 首';
  $('#deck').classList.remove('revealed','playing');
  $('#answer').innerHTML='';
  $('#guessCtl').hidden=false; $('#judge').hidden=true;
  paintSteps(); readyHint();
  if(iframe&&ytReady) cmd('cueVideoById',[cur[0],startAt]); else mountPlayer(cur[0]);
}
function paintSteps(){
  document.querySelectorAll('.step').forEach((el,i)=>{el.classList.toggle('on',i===stage);el.classList.toggle('done',i<stage)});
  $('#playBtn').textContent='▶ 播放 '+STAGES[stage].sec+' 秒';
  $('#moreBtn').disabled=stage>=STAGES.length-1;
  $('#moreBtn').textContent=stage>=STAGES.length-1?'已經最長了':'聽 '+STAGES[stage+1].sec+' 秒';
}
function playClip(){
  if(revealed)return;
  clearTimeout(stopTimer); playToken++;
  if(state===1||state===2||state===3) cmd('seekTo',[startAt,true]); // 播過了：拉回起點
  cmd('playVideo'); // 還沒播過：位置本來就在起點
  const tok=playToken;
  setTimeout(()=>{ if(tok===playToken&&state!==1&&state!==3&&!revealed) cmd('playVideo'); },1200); // 換歌後還在載入時補按一次
  setTimeout(()=>{ if(tok===playToken&&state!==1&&state!==3&&!revealed) toast('沒聲音的話，直接點一下卡帶畫面'); },3000);
}
$('#playBtn').onclick=playClip;
$('#moreBtn').onclick=()=>{ if(stage<STAGES.length-1){stage++; paintSteps(); playClip();} };
$('#shiftBtn').onclick=()=>{ startAt=pickStart(cur[3]); stopClip(); toast('換到歌的另一段'); };
$('#skipBtn').onclick=()=>nextSong(true);
$('#revealBtn').onclick=()=>{
  revealed=true; clearTimeout(stopTimer); playToken++;
  const deck=$('#deck'); deck.classList.add('revealed');
  $('#answer').innerHTML='<small>'+cur[2]+'</small>'+cur[1];
  cmd('playVideo');
  $('#guessCtl').hidden=true; $('#judge').hidden=false;
};
$('#nextBtn').onclick=()=>{ recap.push({t:cur[1],a:cur[2],sec:STAGES[stage].sec}); nextSong(false); };
function nextSong(skipped){
  cmd('pauseVideo'); markPlayed(cur[0]);
  if(skipped){ queue.splice(qi,1); if(qi>=queue.length){ return finish(); } return loadSong(); }
  qi++; if(qi>=total||qi>=queue.length) return finish(); loadSong();
}
function finish(){
  $('#player').innerHTML=''; iframe=null;
  $('#game').hidden=true; $('#over').hidden=false; $('#counter').hidden=true;
  $('#recap').innerHTML=recap.map(r=>'<div><span>'+r.t+'・'+r.a+'</span><span>聽了 '+r.sec+' 秒</span></div>').join('');
}
$('#againBtn').onclick=()=>{ $('#over').hidden=true; $('#setup').hidden=false; refreshSetup(); };
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}
refreshSetup();
</script>
</body>
